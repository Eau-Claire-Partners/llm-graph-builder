name: Backend pipeline
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker-build.yml"

jobs:
  collect_metadata:
    name: Collect Metadata
    runs-on: ubuntu-latest
    outputs:
      build_info: ${{ steps.metadata.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect GitHub Metadata
        id: metadata
        run: |
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

          echo "build_info=$(cat << EOF | jq -c .
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "git": {
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}"
            },
            "pull_request": {
              "number": "${{ github.event.pull_request.number }}",
              "title": "${{ github.event.pull_request.title }}",
              "base_branch": "${{ github.event.pull_request.base.ref }}",
              "author": "${{ github.event.pull_request.user.login }}"
            },
            "linked_issues": "${{ toJSON(github.event.pull_request.body) }}"
          }
          EOF
          )" >> $GITHUB_OUTPUT

  build_test:
    name: Build Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q .

  build_and_push:
    name: Build And Push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [collect_metadata]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
          echo "Branch name: ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

      - name: Build timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Description
        id: description
        run: |
          DESCRIPTION=$(cat << EOF
          Backend built from branch: ${{ steps.extract_branch.outputs.branch }}

          Commit: ${{ github.sha }}
          Build Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          Pull Request: ${{ github.event.pull_request.title }}
          Author: ${{ github.event.pull_request.user.login }}

          Build Info: '${{ needs.collect_metadata.outputs.build_info }}'
          EOF
          )

          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get lowercase repository name
        run: echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}/backend:latest
            ghcr.io/${{ env.REPO_LOWERCASE }}/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=LLM Graph Builder Backend
            org.opencontainers.image.description=${{ steps.description.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            com.github.repo.branch=${{ steps.extract_branch.outputs.branch }}
            com.github.build_info=${{ needs.collect_metadata.outputs.build_info }}
